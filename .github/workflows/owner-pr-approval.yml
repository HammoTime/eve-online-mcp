name: Owner PR approval

run-name: Approve PR #${{ inputs.pull-request-number }} as requested by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: "Open pull request number"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    if: github.repository == 'HammoTime/eve-online-mcp' && github.actor == 'HammoTime'
    runs-on: ubuntu-latest
    steps:
      - name: Verify open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
        shell: bash
        run: |
          set -euo pipefail

          state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" --jq '.state')"
          if [ "$state" != "open" ]; then
            echo "Pull request #${PULL_REQUEST_NUMBER} is ${state}, not open." >&2
            exit 1
          fi

      - name: Approve pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
        run: >-
          gh pr review
          "https://github.com/${GITHUB_REPOSITORY}/pull/${PULL_REQUEST_NUMBER}"
          --approve
          --body "Approved by the repository owner's explicit workflow dispatch."
