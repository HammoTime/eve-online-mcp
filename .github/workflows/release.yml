name: Release and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.release-token.outputs.token }}
          release-type: node
          target-branch: main

  publish-plan:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      should_publish: ${{ steps.plan.outputs.should_publish }}
      publish_npmjs: ${{ steps.plan.outputs.publish_npmjs }}
      publish_github_packages: ${{ steps.plan.outputs.publish_github_packages }}
      tag_name: ${{ steps.plan.outputs.tag_name }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@hammotime"
          package-manager-cache: false
      - name: Select missing registry copies for a GitHub release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_CREATED: ${{ needs.release.outputs.release_created }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p 'require("./package.json").name')"
          github_package="@hammotime/${package_name##*/}"
          package_version="$(node -p 'require("./package.json").version')"

          if [ "$RELEASE_CREATED" = "true" ]; then
            version="$RELEASE_VERSION"
            tag_name="$RELEASE_TAG"
          else
            # Bootstrap a GitHub release that predates this publishing workflow.
            version="$package_version"
            tag_name="v${version}"
          fi

          expected_tag="v${version}"
          if [ "$tag_name" != "$expected_tag" ]; then
            echo "Release tag $tag_name does not match version $version." >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/${tag_name}"; then
            echo "No ${tag_name} tag is available; nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            echo "Tag ${tag_name} is not a GitHub Release; nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npmjs_version="$(npm view "${package_name}@${version}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          github_version="$(npm view "${github_package}@${version}" version --registry=https://npm.pkg.github.com 2>/dev/null || true)"

          publish_npmjs=true
          if [ "$npmjs_version" = "$version" ]; then
            echo "${package_name}@${version} is already published to npmjs."
            publish_npmjs=false
          fi

          publish_github_packages=true
          if [ "$github_version" = "$version" ]; then
            echo "${github_package}@${version} is already published to GitHub Packages."
            publish_github_packages=false
          fi

          if [ "$publish_npmjs" = "false" ] && [ "$publish_github_packages" = "false" ]; then
            echo "All registries already contain version ${version}."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Publishing missing registry copies for ${tag_name}."
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "publish_npmjs=${publish_npmjs}" >> "$GITHUB_OUTPUT"
          echo "publish_github_packages=${publish_github_packages}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [release, publish-plan]
    if: needs.publish-plan.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: npmjs.com
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-plan.outputs.tag_name }}
      - name: Require release tag to match package version
        env:
          RELEASE_TAG: ${{ needs.publish-plan.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.publish-plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          expected_tag="v${package_version}"
          if [ "$RELEASE_VERSION" != "$package_version" ] || [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release mismatch: package=$package_version release=$RELEASE_VERSION tag=$RELEASE_TAG expected=$expected_tag" >&2
            exit 1
          fi
      - name: Build development container
        run: docker build --target development -f .devcontainer/Dockerfile -t eve-online-mcp-dev .
      - name: Validate and pack inside development container
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          -e HOME=/tmp
          -v "$PWD:/workspace"
          -w /workspace
          eve-online-mcp-dev
          sh -lc "npm ci && npm run validate && npm pack --dry-run"
      - uses: actions/setup-node@v7
        if: needs.publish-plan.outputs.publish_npmjs == 'true'
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Publish first package version with bootstrap token
        if: needs.publish-plan.outputs.publish_npmjs == 'true' && env.NPM_TOKEN != ''
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Publish matching version through trusted publishing
        if: needs.publish-plan.outputs.publish_npmjs == 'true' && env.NPM_TOKEN == ''
        run: npm publish --ignore-scripts --provenance
      - uses: actions/setup-node@v7
        if: needs.publish-plan.outputs.publish_github_packages == 'true'
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@hammotime"
          package-manager-cache: false
      - name: Prepare the GitHub Packages scope
        if: needs.publish-plan.outputs.publish_github_packages == 'true'
        run: npm pkg set name="@hammotime/eve-online-mcp"
      - name: Publish matching version to GitHub Packages
        if: needs.publish-plan.outputs.publish_github_packages == 'true'
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
