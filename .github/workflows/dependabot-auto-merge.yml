name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: "Existing Dependabot pull request number"
        required: true
        type: number

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: >-
    dependabot-auto-merge-${{ github.event_name == 'workflow_dispatch' &&
    inputs.pull-request-number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve-and-schedule:
    if: >-
      github.repository == 'HammoTime/eve-online-mcp' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Verify Dependabot pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: >-
            ${{ github.event_name == 'workflow_dispatch' &&
            inputs.pull-request-number || github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          author="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" --jq '.user.login')"
          if [ "$author" != "dependabot[bot]" ]; then
            echo "Pull request #${PULL_REQUEST_NUMBER} was opened by ${author}, not Dependabot." >&2
            exit 1
          fi

          echo "number=${PULL_REQUEST_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/pull/${PULL_REQUEST_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Approve pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.url }}
        run: gh pr review "$PULL_REQUEST_URL" --approve --body "Approved for automatic merge after required checks pass."

      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.url }}
        run: gh pr merge "$PULL_REQUEST_URL" --auto --squash

      - name: Dispatch release workflow after merge
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.number }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          for _attempt in {1..120}; do
            state="$(gh pr view "$PULL_REQUEST_URL" --json state --jq '.state')"
            if [ "$state" = "MERGED" ]; then
              gh workflow run release.yml --ref main
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "Pull request #${PULL_REQUEST_NUMBER} closed without merging." >&2
              exit 1
            fi
            sleep 15
          done

          echo "Timed out waiting for pull request #${PULL_REQUEST_NUMBER} to merge." >&2
          exit 1
