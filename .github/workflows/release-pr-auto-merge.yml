name: Release PR auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: "Existing Release Please pull request number"
        required: true
        type: number

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: >-
    release-pr-auto-merge-${{ github.event_name == 'workflow_dispatch' &&
    inputs.pull-request-number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve-and-schedule:
    if: >-
      github.repository == 'HammoTime/eve-online-mcp' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.user.login == 'tagreleaserestrictor[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Verify Release Please pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: >-
            ${{ github.event_name == 'workflow_dispatch' &&
            inputs.pull-request-number || github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          pull_request="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}")"
          author="$(jq -r '.user.login' <<< "$pull_request")"
          head_ref="$(jq -r '.head.ref' <<< "$pull_request")"
          head_sha="$(jq -r '.head.sha' <<< "$pull_request")"
          base_ref="$(jq -r '.base.ref' <<< "$pull_request")"
          state="$(jq -r '.state' <<< "$pull_request")"
          title="$(jq -r '.title' <<< "$pull_request")"

          test "$author" = "tagreleaserestrictor[bot]"
          test "$head_ref" = "release-please--branches--main--components--eve-online-mcp"
          test "$base_ref" = "main"
          test "$state" = "open"
          [[ "$title" =~ ^chore\(main\):\ release\ [0-9]+\.[0-9]+\.[0-9]+$ ]]

          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/files" --jq '.[].filename' | sort)"
          expected_files=$'CHANGELOG.md\npackage-lock.json\npackage.json'
          test "$files" = "$expected_files"

          version="${title##* }"
          package_version="$(gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${head_sha}" --jq '.content' | base64 --decode | jq -r '.version')"
          lock_version="$(gh api "repos/${GITHUB_REPOSITORY}/contents/package-lock.json?ref=${head_sha}" --jq '.content' | base64 --decode | jq -r '.version')"
          changelog="$(gh api "repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md?ref=${head_sha}" --jq '.content' | base64 --decode)"

          test "$package_version" = "$version"
          test "$lock_version" = "$version"
          grep -Fq "## [${version}]" <<< "$changelog"

          echo "number=${PULL_REQUEST_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/pull/${PULL_REQUEST_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Approve release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.url }}
        run: gh pr review "$PULL_REQUEST_URL" --approve --body "Verified Release Please output; approved for automatic merge after required checks pass."

      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.url }}
        run: gh pr merge "$PULL_REQUEST_URL" --auto --squash

      - name: Dispatch release workflow after merge
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.number }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..120}; do
            state="$(gh pr view "$PULL_REQUEST_URL" --json state --jq '.state')"
            if [ "$state" = "MERGED" ]; then
              gh workflow run release.yml --ref main
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "Pull request #${PULL_REQUEST_NUMBER} closed without merging." >&2
              exit 1
            fi
            sleep 15
          done

          echo "Timed out waiting for pull request #${PULL_REQUEST_NUMBER} to merge." >&2
          exit 1
