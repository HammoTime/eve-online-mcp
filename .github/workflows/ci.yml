name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build development container
        run: docker build --target development -f .devcontainer/Dockerfile -t eve-online-mcp-dev .
      - name: Validate inside development container
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          -e HOME=/tmp
          -v "$PWD:/workspace"
          -w /workspace
          eve-online-mcp-dev
          sh -lc "npm ci && npm run validate"
