name: Monitor ESI OpenAPI schema

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: esi-openapi-schema-monitor
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'HammoTime/eve-online-mcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build development container
        run: docker build --target development -f .devcontainer/Dockerfile -t eve-online-mcp-dev .
      - name: Compare pinned schema with ESI
        id: schema
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          -e HOME=/tmp
          -e GITHUB_OUTPUT=/tmp/github_output
          -v "$PWD:/workspace"
          -v "$GITHUB_OUTPUT:/tmp/github_output"
          -w /workspace
          eve-online-mcp-dev
          sh -lc "npm ci && npm run schema:check"
      - name: File detected schema change in eve-online-mcp
        if: steps.schema.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ steps.schema.outputs.body }}
        run: bash scripts/report-schema-change.sh
